<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Peprint AB i Västerås. Kontakta Petter Österlund.">
    <title>Peprint AB</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <svg class="color-filters" aria-hidden="true">
      <filter id="peprint-orange" color-interpolation-filters="sRGB">
        <feComponentTransfer>
          <feFuncR type="linear" slope="0.421" intercept="0.579" />
          <feFuncG type="linear" slope="0.732" intercept="0.268" />
          <feFuncB type="linear" slope="0.808" intercept="0.192" />
        </feComponentTransfer>
      </filter>
    </svg>

    <main class="business-card">
      <header class="card-header">
        <a class="brand" href="https://www.peprint.se" aria-label="Peprint – startsida">
          <img src="assets/images/peprint-logo.png" alt="Peprint">
        </a>
      </header>

      <div class="open-space" aria-label="Plats för kommande innehåll"></div>

      <p class="contact-name">Petter Österlund</p>

      <footer class="contact-band">
        <address>
          <p>Peprint AB, Sjöhagsvägen 2, 721 32 Västerås, Sweden</p>
          <p>
            <a href="tel:+4621182418">Phone +46 (0)21 18 24 18</a>
            <a href="tel:+46704826725">Mobile +46 (0)70 48 26 725</a>
          </p>
          <p>
            <a href="mailto:petter@peprint.se">petter@peprint.se</a>
            <a href="https://www.peprint.se">www.peprint.se</a>
          </p>
        </address>
      </footer>
    </main>
  </body>
</html>
